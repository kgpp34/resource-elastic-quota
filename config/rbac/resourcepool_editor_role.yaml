# This rule is not used by the project resource-elastic-quota itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the quota.kgpp34.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: resource-elastic-quota
    app.kubernetes.io/managed-by: kustomize
  name: resourcepool-editor-role
rules:
- apiGroups:
  - quota.kgpp34.io
  resources:
  - resourcepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quota.kgpp34.io
  resources:
  - resourcepools/status
  verbs:
  - get
