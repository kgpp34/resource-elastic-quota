# This rule is not used by the project resource-elastic-quota itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over quota.kgpp34.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: resource-elastic-quota
    app.kubernetes.io/managed-by: kustomize
  name: resourcepool-admin-role
rules:
- apiGroups:
  - quota.kgpp34.io
  resources:
  - resourcepools
  verbs:
  - '*'
- apiGroups:
  - quota.kgpp34.io
  resources:
  - resourcepools/status
  verbs:
  - get
