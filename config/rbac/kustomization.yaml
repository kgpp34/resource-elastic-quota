resources:
# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# controller-runtime v0.11 exposes HTTP metrics without delegated
# TokenReview/SubjectAccessReview authentication. NetworkPolicy and a protected
# metrics proxy can be added during the production hardening phase.
# For each CRD, "Admin", "Editor" and "Viewer" roles are scaffolded by
# default, aiding admins in cluster management. Those roles are
# not used by the resource-elastic-quota itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- elasticquotapolicy_admin_role.yaml
- elasticquotapolicy_editor_role.yaml
- elasticquotapolicy_viewer_role.yaml
- departmentquota_admin_role.yaml
- departmentquota_editor_role.yaml
- departmentquota_viewer_role.yaml
- resourcepool_admin_role.yaml
- resourcepool_editor_role.yaml
- resourcepool_viewer_role.yaml
