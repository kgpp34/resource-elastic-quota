# This rule is not used by the project resource-elastic-quota itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to quota.kgpp34.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: resource-elastic-quota
    app.kubernetes.io/managed-by: kustomize
  name: departmentquota-viewer-role
rules:
- apiGroups:
  - quota.kgpp34.io
  resources:
  - departmentquotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quota.kgpp34.io
  resources:
  - departmentquotas/status
  verbs:
  - get
