apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: resource-elastic-quota

configMapGenerator:
  - name: resource-elastic-quota-dashboard
    files:
      - resource-elastic-quota.json
