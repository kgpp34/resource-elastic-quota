---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: elasticquotapolicies.quota.kgpp34.io
spec:
  group: quota.kgpp34.io
  names:
    kind: ElasticQuotaPolicy
    listKind: ElasticQuotaPolicyList
    plural: elasticquotapolicies
    shortNames:
    - eqpolicy
    singular: elasticquotapolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.admission.mode
      name: Admission
      type: string
    - jsonPath: .spec.eviction.enabled
      name: Eviction
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ElasticQuotaPolicy is the Schema for the elasticquotapolicies
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ElasticQuotaPolicySpec defines the singleton cluster-wide
              control policy.
            properties:
              admission:
                description: AdmissionPolicy configures the validating admission webhook
                  behavior.
                properties:
                  failClosedOnStaleSnapshot:
                    default: false
                    type: boolean
                  failClosedOnUnknownPool:
                    default: false
                    type: boolean
                  maxSnapshotAge:
                    type: string
                  mode:
                    default: Observe
                    description: AdmissionMode controls whether quota violations are
                      observed, warned, or denied.
                    enum:
                    - Observe
                    - Warn
                    - Enforce
                    type: string
                type: object
              allocation:
                description: AllocationPolicy configures periodic quota calculation.
                properties:
                  cooldown:
                    type: string
                  fullResync:
                    type: string
                  intervalSeconds:
                    default: 30
                    format: int32
                    minimum: 1
                    type: integer
                  maxDecreasePercent:
                    default: 10
                    format: int32
                    minimum: 0
                    type: integer
                  maxIncreasePercent:
                    default: 10
                    format: int32
                    minimum: 0
                    type: integer
                  minIncrease:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      MinIncrease prevents a small current quota from taking too many cycles to grow.
                      Version one accepts only limits.memory.
                    type: object
                type: object
              eviction:
                description: EvictionConfig keeps automatic eviction disabled unless
                  explicitly enabled.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  maxPodsPerCycle:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  respectPDB:
                    default: true
                    type: boolean
                  sustainedFor:
                    type: string
                  trigger:
                    default: SevereNodePressure
                    description: EvictionTrigger identifies the only condition allowed
                      to start automatic reclaim.
                    enum:
                    - SevereNodePressure
                    type: string
                type: object
              metrics:
                description: MetricsPolicy configures actual memory usage collection.
                properties:
                  collectionInterval:
                    type: string
                  enabled:
                    default: true
                    type: boolean
                  maxSampleAge:
                    type: string
                  provider:
                    default: MetricsAPI
                    description: MetricsProvider identifies the source of actual memory
                      usage.
                    enum:
                    - MetricsAPI
                    - Prometheus
                    type: string
                type: object
              pressure:
                description: PressurePolicy configures capacity protection thresholds.
                properties:
                  blockBorrowingOnNodeMemoryPressure:
                    default: true
                    type: boolean
                  highWatermarkPercent:
                    default: 85
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  recoveryWindow:
                    type: string
                  severeWatermarkPercent:
                    default: 95
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                type: object
              resources:
                description: Version one supports only memory. The list allows later
                  resource expansion.
                items:
                  description: ResourceName is the name identifying various resources
                    in a ResourceList.
                  enum:
                  - memory
                  type: string
                maxItems: 1
                minItems: 1
                type: array
            required:
            - resources
            type: object
          status:
            description: ElasticQuotaPolicyStatus describes policy health and calculation
              freshness.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastCalculationTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
