apiVersion: v1
kind: Namespace
metadata:
  name: quota-stage2-test
  labels:
    quota.kgpp34.io/enforced: "true"
    quota.kgpp34.io/department: stage2
---
apiVersion: quota.kgpp34.io/v1alpha1
kind: ResourcePool
metadata:
  name: stage2-arm64v8-kylin
spec:
  nodeSelector:
    matchLabels:
      nodetype.cks.io/arch: arm64v8
      nodetype.cks.io/os: kylin
---
apiVersion: quota.kgpp34.io/v1alpha1
kind: ResourcePool
metadata:
  name: stage2-amd64-kylin
spec:
  nodeSelector:
    matchLabels:
      nodetype.cks.io/arch: amd64
      nodetype.cks.io/os: kylin
---
apiVersion: quota.kgpp34.io/v1alpha1
kind: DepartmentQuota
metadata:
  name: stage2
spec:
  department: stage2
  namespaceSelector:
    matchLabels:
      quota.kgpp34.io/enforced: "true"
      quota.kgpp34.io/department: stage2
  evictionPolicy: Deny
  pools:
  - name: stage2-arm64v8-kylin
    baseQuota:
      memory: 1Gi
    maxQuota:
      memory: 2Gi
  - name: stage2-amd64-kylin
    baseQuota:
      memory: 1Gi
    maxQuota:
      memory: 2Gi
---
apiVersion: quota.kgpp34.io/v1alpha1
kind: ElasticQuotaPolicy
metadata:
  name: default
spec:
  resources:
  - memory
  allocation:
    fullResync: 10s
  admission:
    mode: Observe
  eviction:
    enabled: false
---
apiVersion: v1
kind: Pod
metadata:
  name: arm-accounting
  namespace: quota-stage2-test
  labels:
    department: stage2
    quota.kgpp34.io/resource-pool: stage2-arm64v8-kylin
spec:
  nodeName: dev-control-plane
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: amd-accounting
  namespace: quota-stage2-test
  labels:
    department: stage2
    quota.kgpp34.io/resource-pool: stage2-amd64-kylin
spec:
  nodeName: dev-worker
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: amd-accounting-second
  namespace: quota-stage2-test
  labels:
    department: stage2
    quota.kgpp34.io/resource-pool: stage2-amd64-kylin
spec:
  nodeName: dev-worker
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi
